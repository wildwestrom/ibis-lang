name = "ibis"
version = "0.1.0"
defaultTargets = ["ibis", "ibisTests", "IbisProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "IbisProofs"

[[lean_lib]]
name = "Ibis"

[[lean_exe]]
name = "ibis"
root = "Main"

[[lean_exe]]
name = "ibisTests"
root = "Tests"
